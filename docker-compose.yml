services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command:
    - python3
    - main.py
    container_name: moneyprinterturbo-api
    environment:
    - KB_API_BASE=http://${SERVER_HOST}:3001
    - KB_API_USER=${KB_API_USER}
    - KB_API_PASS=${KB_API_PASS}
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 50m
    ports:
    - 127.0.0.1:8088:8080
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://localhost:8080/docs || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
    restart: always
    volumes: &id001
    - ./:/MoneyPrinterTurbo
  webui:
    build:
      context: .
      dockerfile: Dockerfile
    command:
    - streamlit
    - run
    - ./webui/Main.py
    - --server.address=0.0.0.0
    - --server.port=8501
    - --browser.serverAddress=${SERVER_HOST}
    - --server.enableCORS=True
    - --browser.gatherUsageStats=False
    - --client.toolbarMode=minimal
    - --logger.hideWelcomeMessage=True
    - --server.enableXsrfProtection=False
    - --server.showEmailPrompt=False
    container_name: moneyprinterturbo-webui
    environment:
    - MPT_API_BASE=http://${SERVER_HOST}:8080
    - KB_API_BASE=http://${SERVER_HOST}:3001
    - KB_API_USER=${KB_API_USER}
    - KB_API_PASS=${KB_API_PASS}
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 50m
    ports:
    - 127.0.0.1:8502:8501
    restart: always
    volumes: *id001
x-common-volumes: *id001
