services:
  mysql:
    image: mysql:8.0
    container_name: mpt-mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
    - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root_secret}
    - MYSQL_DATABASE=${MYSQL_DATABASE:-mpt}
    - MYSQL_USER=${MYSQL_USER:-mpt}
    - MYSQL_PASSWORD=${MYSQL_PASSWORD:-mpt_secret}
    ports:
    - 3307:3306
    volumes:
    - mysql_data:/var/lib/mysql
    healthcheck:
      test:
      - CMD-SHELL
      - mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command:
    - python3
    - main.py
    container_name: moneyprinterturbo-api
    environment:
    - KB_API_BASE=http://${SERVER_HOST}:3001
    - KB_API_USER=${KB_API_USER}
    - KB_API_PASS=${KB_API_PASS}
    - AUTH_DATABASE_URL=mysql+pymysql://${MYSQL_USER:-mpt}:${MYSQL_PASSWORD:-mpt_secret}@mysql:3306/${MYSQL_DATABASE:-mpt}?charset=utf8mb4
    - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production-please-9f8a7b6c}
    - JWT_EXPIRE_MINUTES=${JWT_EXPIRE_MINUTES:-10080}
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 50m
    ports:
    - 127.0.0.1:8088:8080
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://localhost:8080/docs || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
    restart: always
    volumes: &id001
    - ./:/MoneyPrinterTurbo
  webui:
    build:
      context: .
      dockerfile: Dockerfile
    command:
    - streamlit
    - run
    - ./webui/Main.py
    - --server.address=0.0.0.0
    - --server.port=8501
    - --browser.serverAddress=${SERVER_HOST}
    - --server.enableCORS=True
    - --browser.gatherUsageStats=False
    - --client.toolbarMode=minimal
    - --logger.hideWelcomeMessage=True
    - --server.enableXsrfProtection=False
    - --server.showEmailPrompt=False
    container_name: moneyprinterturbo-webui
    environment:
    - MPT_API_BASE=http://${SERVER_HOST}:8080
    - KB_API_BASE=http://${SERVER_HOST}:3001
    - KB_API_USER=${KB_API_USER}
    - KB_API_PASS=${KB_API_PASS}
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 50m
    ports:
    - 127.0.0.1:8502:8501
    restart: always
    volumes: *id001
x-common-volumes: *id001
volumes:
  mysql_data:
